
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Editor PRO</title>

<!-- DOCX generator -->
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

<style>
:root {
    --paper-width: 8.27in;
    --paper-height: 11.69in;
    --paper-margin: 0.8in;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e7e7e7;
    color: #222;
}

header {
    background: #185c38;
    color: white;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
}

header h2 {
    margin: 0;
    font-size: 19px;
}

.header-buttons,
.toolbar,
.settings {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
}

button, select, input {
    font: inherit;
}

button {
    padding: 8px 11px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 5px;
    cursor: pointer;
}

button:active {
    background: #dceee3;
}

.primary {
    background: #16834a;
    color: white;
    border: none;
}

.toolbar {
    background: #fafafa;
    padding: 10px;
    border-bottom: 1px solid #ccc;
}

.toolbar select {
    padding: 7px;
    border: 1px solid #bbb;
    border-radius: 4px;
    max-width: 100%;
}

.toolbar button {
    min-width: 35px;
}

.settings {
    background: #eee;
    padding: 10px;
    border-bottom: 1px solid #ccc;
}

.settings label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
}

.settings input,
.settings select {
    padding: 7px;
    border: 1px solid #bbb;
    border-radius: 4px;
}

.settings input {
    width: 65px;
}

input[type="color"] {
    width: 36px;
    height: 32px;
    padding: 2px;
}

.workspace {
    height: calc(100vh - 195px);
    min-height: 350px;
    overflow: auto;
    padding: 25px 15px 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: pan-x pan-y;
    -webkit-overflow-scrolling: touch;
}

#pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
}

.paper {
    background: white;
    width: var(--paper-width);
    height: var(--paper-height);
    min-width: var(--paper-width);
    flex: none;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 12px #0002;
}

.page-content {
    width: 100%;
    height: 100%;
    padding: var(--paper-margin);
    outline: none;
    overflow: hidden;
    overflow-wrap: break-word;
    word-wrap: break-word;
    font-family: Arial, sans-serif;
    font-size: 12pt;
    line-height: 1.35;
}

.page-content:focus {
    outline: none;
}

.page-content p {
    margin-top: 0;
    margin-bottom: 10px;
}

.page-number {
    position: absolute;
    bottom: 10px;
    right: 22px;
    color: #999;
    font-size: 11px;
    pointer-events: none;
}

.status {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 12px;
    background: #185c38;
    color: white;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    z-index: 10;
}

@media print {
    @page {
        size: auto;
        margin: 0;
    }

    body {
        background: white;
    }

    header,
    .toolbar,
    .settings,
    .status {
        display: none !important;
    }

    .workspace {
        display: block;
        height: auto;
        overflow: visible;
        padding: 0;
    }

    #pages {
        display: block;
    }

    .paper {
        margin: 0;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
    }

    .page-content {
        overflow: visible;
    }
}
</style>
</head>

<body>

<header>
    <h2>📝 Word BETA by andro</h2>

    <div class="header-buttons">
        <button onclick="downloadHTML()">HTML</button>
        <button onclick="downloadDOCX()">Word DOCX</button>
        <button onclick="downloadPDF()">PDF</button>
        <button class="primary" onclick="shareDocument()">Share</button>
    </div>
</header>

<!-- TEXT TOOLBAR -->
<div class="toolbar">

    <select id="fontFamily" onchange="format('fontName', this.value)">
        <option value="Arial">Arial</option>
        <option value="Calibri">Calibri</option>
        <option value="Cambria">Cambria</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Georgia">Georgia</option>
        <option value="Verdana">Verdana</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Trebuchet MS">Trebuchet MS</option>
        <option value="Comic Sans MS">Comic Sans MS</option>
        <option value="Courier New">Courier New</option>
        <option value="Garamond">Garamond</option>
        <option value="Consolas">Consolas</option>
    </select>

    <select id="fontSize" onchange="setFontSize(this.value)">
        <option value="1">8 pt</option>
        <option value="2">10 pt</option>
        <option value="3" selected>12 pt</option>
        <option value="4">14 pt</option>
        <option value="5">18 pt</option>
        <option value="6">24 pt</option>
        <option value="7">36 pt</option>
    </select>

    <button onclick="format('bold')"><b>B</b></button>
    <button onclick="format('italic')"><i>I</i></button>
    <button onclick="format('underline')"><u>U</u></button>
    <button onclick="format('strikeThrough')"><s>S</s></button>

    <button onclick="format('justifyLeft')">Left</button>
    <button onclick="format('justifyCenter')">Center</button>
    <button onclick="format('justifyRight')">Right</button>
    <button onclick="format('justifyFull')">Justify</button>

    <button onclick="format('insertUnorderedList')">• List</button>
    <button onclick="format('insertOrderedList')">1. List</button>
    <button onclick="format('indent')">Indent</button>
    <button onclick="format('outdent')">Outdent</button>

    <label>
        Text
        <input type="color" onchange="format('foreColor', this.value)">
    </label>

    <label>
        Highlight
        <input type="color" value="#ffff00"
        onchange="format('hiliteColor', this.value)">
    </label>

    <button onclick="format('undo')">↶</button>
    <button onclick="format('redo')">↷</button>
    <button onclick="format('removeFormat')">Clear Format</button>

</div>

<!-- PAPER SETTINGS -->
<div class="settings">

    <label>
        Paper
        <select id="paperSize" onchange="changePaper()">
            <option value="a4">A4</option>
            <option value="short">Short Bond Paper</option>
            <option value="long">Long Bond Paper</option>
            <option value="a3">A3</option>
            <option value="a5">A5</option>
            <option value="letter">Letter</option>
            <option value="legal">Legal</option>
            <option value="custom">Custom</option>
        </select>
    </label>

    <label>
        Width
        <input id="customWidth" type="number" step="0.1" value="8.27">
    </label>

    <label>
        Height
        <input id="customHeight" type="number" step="0.1" value="11.69">
    </label>

    <label>
        Margin
        <input id="margin" type="number" step="0.1" value="0.8">
    </label>

    <label>
        Orientation
        <select id="orientation" onchange="changePaper()">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
        </select>
    </label>

    <button onclick="applyPaper()">Apply Size</button>

</div>

<!-- PAGE CONTROLS -->
<div class="toolbar">

    <button class="primary" onclick="addPage()">+ Add Page</button>
    <button onclick="insertPageBreak()">Page Break</button>
    <button onclick="removeLastPage()">Remove Last Page</button>

    <button onclick="document.getElementById('fileInput').click()">
        Open File
    </button>

    <input
        id="fileInput"
        type="file"
        accept=".html,.htm,.txt"
        hidden
        onchange="openFile(event)"
    >

</div>

<!-- EDITOR -->
<div class="workspace">
    <div id="pages"></div>
</div>

<div class="status">
    <span id="pageStatus">Pages: 1</span>
    <span id="wordStatus">Words: 0</span>
    <span id="saveStatus">Ready</span>
</div>

<script>

/* =========================
   GLOBAL SETTINGS
========================= */

const pagesContainer = document.getElementById("pages");

let documentName = "My Document";

let pageWidth = 8.27;
let pageHeight = 11.69;
let pageMargin = 0.8;

let savedRange = null;
let isPaginating = false;
let paginationTimer = null;

const paperSizes = {
    a4: [8.27, 11.69],
    short: [8.5, 11],
    long: [8.5, 13],
    a3: [11.69, 16.54],
    a5: [5.83, 8.27],
    letter: [8.5, 11],
    legal: [8.5, 14]
};


/* =========================
   PAGE MANAGEMENT
========================= */

function getEditors() {
    return [...document.querySelectorAll(".page-content")];
}

function getActiveEditor() {
    const selection = window.getSelection();

    if (selection && selection.rangeCount) {
        let node = selection.anchorNode;

        while (node && node !== document.body) {
            if (
                node.nodeType === 1 &&
                node.classList.contains("page-content")
            ) {
                return node;
            }

            node = node.parentNode;
        }
    }

    const editors = getEditors();
    return editors[editors.length - 1];
}

function makePage(html = "") {

    const paper = document.createElement("div");
    paper.className = "paper";

    const editor = document.createElement("div");
    editor.className = "page-content";
    editor.contentEditable = "true";
    editor.spellcheck = true;
    editor.innerHTML = html;

    const number = document.createElement("div");
    number.className = "page-number";

    editor.addEventListener("keyup", saveSelection);
    editor.addEventListener("mouseup", saveSelection);
    editor.addEventListener("touchend", saveSelection);

    editor.addEventListener("input", function() {

        saveSelection();

        clearTimeout(paginationTimer);

        paginationTimer = setTimeout(function() {
            paginateAll();
            updateStatus();
            saveDocument();
        }, 200);

    });

    paper.appendChild(editor);
    paper.appendChild(number);

    pagesContainer.appendChild(paper);

    updatePaperStyle();
    renumberPages();

    return editor;
}

function addPage() {
    const editor = makePage();
    editor.focus();

    updateStatus();
    saveDocument();
}

function insertPageBreak() {

    const editor = getActiveEditor();

    if (!editor) return;

    const next = makePage();

    next.focus();

    updateStatus();
    saveDocument();
}

function removeLastPage() {

    const editors = getEditors();

    if (editors.length <= 1) {
        alert("You must keep at least one page.");
        return;
    }

    pagesContainer.lastElementChild.remove();

    renumberPages();
    updateStatus();
    saveDocument();
}

function renumberPages() {

    document.querySelectorAll(".page-number").forEach(
        (element, index) => {
            element.textContent = index + 1;
        }
    );

}


/* =========================
   TEXT FORMATTING
========================= */

function saveSelection() {

    const selection = window.getSelection();

    if (selection && selection.rangeCount) {
        savedRange = selection.getRangeAt(0).cloneRange();
    }

}

function restoreSelection() {

    if (!savedRange) return;

    const selection = window.getSelection();

    try {
        selection.removeAllRanges();
        selection.addRange(savedRange);
    } catch (error) {}

}

function format(command, value = null) {

    restoreSelection();

    document.execCommand(command, false, value);

    saveSelection();
    updateStatus();
    saveDocument();

}

function setFontSize(size) {

    restoreSelection();

    document.execCommand("fontSize", false, size);

    saveSelection();
    saveDocument();

}


/* =========================
   PAPER SETTINGS
========================= */

function updatePaperStyle() {

    document.documentElement.style.setProperty(
        "--paper-width",
        pageWidth + "in"
    );

    document.documentElement.style.setProperty(
        "--paper-height",
        pageHeight + "in"
    );

    document.documentElement.style.setProperty(
        "--paper-margin",
        pageMargin + "in"
    );

}

function changePaper() {

    const selected = document.getElementById("paperSize").value;

    if (selected === "custom") return;

    [pageWidth, pageHeight] = paperSizes[selected];

    if (
        document.getElementById("orientation").value === "landscape"
    ) {
        [pageWidth, pageHeight] = [pageHeight, pageWidth];
    }

    document.getElementById("customWidth").value = pageWidth;
    document.getElementById("customHeight").value = pageHeight;

    updatePaperStyle();
    paginateAll();
    saveDocument();

}

function applyPaper() {

    const selected = document.getElementById("paperSize").value;

    if (selected === "custom") {

        pageWidth = Number(
            document.getElementById("customWidth").value
        );

        pageHeight = Number(
            document.getElementById("customHeight").value
        );

        if (
            document.getElementById("orientation").value === "landscape" &&
            pageWidth < pageHeight
        ) {
            [pageWidth, pageHeight] = [pageHeight, pageWidth];
        }

    } else {
        changePaper();
    }

    pageMargin = Number(
        document.getElementById("margin").value
    );

    if (
        !Number.isFinite(pageWidth) ||
        !Number.isFinite(pageHeight) ||
        !Number.isFinite(pageMargin) ||
        pageWidth <= 0 ||
        pageHeight <= 0 ||
        pageMargin < 0 ||
        pageMargin * 2 >= Math.min(pageWidth, pageHeight)
    ) {
        alert("Please enter valid paper dimensions and margins.");
        return;
    }

    updatePaperStyle();
    paginateAll();
    saveDocument();

}


/* =========================
   AUTOMATIC PAGINATION
========================= */

function editorOverflows(editor) {
    return editor.scrollHeight > editor.clientHeight + 2;
}

function getNextEditor(editor) {

    const editors = getEditors();
    const index = editors.indexOf(editor);

    if (index >= 0 && editors[index + 1]) {
        return editors[index + 1];
    }

    return makePage();
}

function paginateAll() {

    if (isPaginating) return;

    isPaginating = true;

    try {

        let safety = 0;
        let editors = getEditors();

        for (let i = 0; i < editors.length && safety < 200; i++) {

            let editor = editors[i];

            while (editorOverflows(editor) && safety < 200) {

                safety++;

                const last = editor.lastElementChild;

                if (!last) break;

                const next = getNextEditor(editor);

                next.insertBefore(last, next.firstChild);

                if (
                    editorOverflows(editor) &&
                    editor.children.length === 1
                ) {
                    break;
                }

            }

            editors = getEditors();

        }

        renumberPages();

    } finally {
        isPaginating = false;
    }

}


/* =========================
   STATUS
========================= */

function updateStatus() {

    const editors = getEditors();

    const text = editors.map(
        editor => editor.innerText
    ).join(" ");

    const words = text.trim()
        ? text.trim().split(/\s+/).length
        : 0;

    document.getElementById("pageStatus").textContent =
        "Pages: " + editors.length;

    document.getElementById("wordStatus").textContent =
        "Words: " + words;

}


/* =========================
   EXPORT HELPERS
========================= */

function getExportPages() {

    return getEditors().map(editor => ({
        html: editor.innerHTML,
        text: editor.innerText || editor.textContent || ""
    }));

}

function safeFilename(name) {

    return (name || "My Document")
        .replace(/[\\/:*?"<>|]/g, "_")
        .trim() || "My Document";

}

function hasDocumentText(pages) {

    return pages.some(page => page.text.trim().length > 0);

}


/* =========================
   NORMAL DEVICE DOWNLOAD
========================= */

function downloadFile(blob, filename) {

    try {

        if (!(blob instanceof Blob) || blob.size === 0) {
            alert("The generated file is empty.");
            return;
        }

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = filename;
        link.style.display = "none";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(function() {
            URL.revokeObjectURL(url);
        }, 60000);

    } catch (error) {

        console.error(error);
        alert("Download failed: " + error.message);

    }

}


/* =========================
   HTML DOWNLOAD
========================= */

function downloadHTML() {

    const pages = getExportPages();

    if (!hasDocumentText(pages)) {
        alert("There is no text to download.");
        return;
    }

    const pageHTML = pages.map(page => `
        <section class="paper">
            <div class="page-content">
                ${page.html}
            </div>
        </section>
    `).join("\n");

    const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${safeFilename(documentName)}</title>

<style>
body {
    margin: 20px;
    background: #eee;
}

.paper {
    background: white;
    width: ${pageWidth}in;
    height: ${pageHeight}in;
    margin: 20px auto;
    overflow: hidden;
    box-shadow: 0 2px 8px #aaa;
    page-break-after: always;
}

.page-content {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    padding: ${pageMargin}in;
    overflow: hidden;
    overflow-wrap: break-word;
    font-family: Arial;
    font-size: 12pt;
    line-height: 1.35;
}

@media print {
    body {
        margin: 0;
        background: white;
    }

    .paper {
        margin: 0;
        box-shadow: none;
    }
}
</style>
</head>

<body>
${pageHTML}
</body>
</html>`;

    const blob = new Blob(
        [html],
        { type: "text/html;charset=utf-8" }
    );

    downloadFile(
        blob,
        safeFilename(documentName) + ".html"
    );

}


/* =========================
   REAL WORD DOCX DOWNLOAD
========================= */

async function downloadDOCX() {

    const pages = getExportPages();

    if (!hasDocumentText(pages)) {
        alert("There is no text to download.");
        return;
    }

    if (!window.docx) {
        alert("Word library did not load. Check your internet connection.");
        return;
    }

    try {

        const {
            Document,
            Paragraph,
            TextRun,
            Packer
        } = window.docx;

        const paragraphs = [];

        pages.forEach((page, pageIndex) => {

            const lines = page.text.split(/\r?\n/);

            lines.forEach((line, lineIndex) => {

                paragraphs.push(
                    new Paragraph({
                        pageBreakBefore:
                            pageIndex > 0 && lineIndex === 0,

                        children: [
                            new TextRun({
                                text: line || " "
                            })
                        ]
                    })
                );

            });

        });

        const doc = new Document({

            sections: [{

                properties: {

                    page: {

                        size: {
                            width: Math.round(pageWidth * 1440),
                            height: Math.round(pageHeight * 1440)
                        },

                        margin: {
                            top: Math.round(pageMargin * 1440),
                            bottom: Math.round(pageMargin * 1440),
                            left: Math.round(pageMargin * 1440),
                            right: Math.round(pageMargin * 1440)
                        }

                    }

                },

                children: paragraphs

            }]

        });

        const blob = await Packer.toBlob(doc);

        if (!blob || blob.size === 0) {
            throw new Error("Word file contains no data.");
        }

        downloadFile(
            blob,
            safeFilename(documentName) + ".docx"
        );

    } catch (error) {

        console.error("DOCX error:", error);

        alert("Word export failed: " + error.message);

    }

}


/* =========================
   PDF DOWNLOAD
========================= */

function downloadPDF() {

    const pages = getExportPages();

    if (!hasDocumentText(pages)) {
        alert("There is no text to print.");
        return;
    }

    const pageHTML = pages.map(page => `
        <section class="paper">
            <div class="page-content">
                ${page.html}
            </div>
        </section>
    `).join("");

    const printWindow = window.open("", "_blank");

    if (!printWindow) {
        alert("Allow pop-ups in your browser to create a PDF.");
        return;
    }

    printWindow.document.open();

    printWindow.document.write(`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>${safeFilename(documentName)}</title>

<style>
@page {
    size: ${pageWidth}in ${pageHeight}in;
    margin: 0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
}

.paper {
    width: ${pageWidth}in;
    height: ${pageHeight}in;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
}

.page-content {
    width: 100%;
    height: 100%;
    padding: ${pageMargin}in;
    overflow: hidden;
    overflow-wrap: break-word;
    font-family: Arial, sans-serif;
    font-size: 12pt;
    line-height: 1.35;
}
</style>
</head>

<body>
${pageHTML}
</body>
</html>`);

    printWindow.document.close();

    setTimeout(function() {

        printWindow.focus();
        printWindow.print();

    }, 1000);

}


/* =========================
   SHARE DOCUMENT
========================= */

function shareDocument() {

    const data = {

        name: documentName,
        width: pageWidth,
        height: pageHeight,
        margin: pageMargin,

        pages: getEditors().map(
            editor => editor.innerHTML
        )

    };

    const encoded = encodeURIComponent(
        btoa(
            unescape(
                encodeURIComponent(
                    JSON.stringify(data)
                )
            )
        )
    );

    const url =
        location.href.split("#")[0] +
        "#sharedDoc=" + encoded;

    if (navigator.share) {

        navigator.share({

            title: documentName,
            text: "Open this document:",
            url: url

        }).catch(function() {
            copyShareLink(url);
        });

    } else {

        copyShareLink(url);

    }

}

function copyShareLink(url) {

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard.writeText(url)
            .then(() => alert("Share link copied!"))
            .catch(() => prompt("Copy this link:", url));

    } else {

        prompt("Copy this link:", url);

    }

}


/* =========================
   OPEN FILE
========================= */

function openFile(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        const content = e.target.result;

        const extension = file.name
            .split(".")
            .pop()
            .toLowerCase();

        pagesContainer.innerHTML = "";

        if (extension === "txt") {

            const editor = makePage();

            editor.innerHTML =
                "<p>" +
                escapeHTML(content).replace(/\n/g, "<br>") +
                "</p>";

        } else {

            const parser = new DOMParser();

            const doc = parser.parseFromString(
                content,
                "text/html"
            );

            const sourcePages =
                doc.querySelectorAll(".page-content");

            if (sourcePages.length) {

                sourcePages.forEach(page => {
                    makePage(page.innerHTML);
                });

            } else {

                makePage(doc.body.innerHTML || content);

            }

        }

        documentName = file.name.replace(/\.[^.]+$/, "");

        paginateAll();
        updateStatus();
        saveDocument();

    };

    reader.readAsText(file);

    event.target.value = "";

}

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

    })[char]);

}


/* =========================
   AUTOSAVE
========================= */

function saveDocument() {

    const data = {

        name: documentName,
        width: pageWidth,
        height: pageHeight,
        margin: pageMargin,

        pages: getEditors().map(
            editor => editor.innerHTML
        )

    };

    try {

        localStorage.setItem(
            "wordEditorDocument",
            JSON.stringify(data)
        );

        document.getElementById("saveStatus").textContent =
            "Saved";

    } catch (error) {

        document.getElementById("saveStatus").textContent =
            "Storage unavailable";

    }

}

function loadData(data) {

    pagesContainer.innerHTML = "";

    documentName = data.name || "My Document";

    pageWidth = Number(data.width) || 8.27;
    pageHeight = Number(data.height) || 11.69;
    pageMargin = Number(data.margin) || 0.8;

    if (
        Array.isArray(data.pages) &&
        data.pages.length
    ) {

        data.pages.forEach(html => {
            makePage(html);
        });

    } else {

        makePage();

    }

    document.getElementById("customWidth").value = pageWidth;
    document.getElementById("customHeight").value = pageHeight;
    document.getElementById("margin").value = pageMargin;

    updatePaperStyle();
    paginateAll();
    updateStatus();

}

function restoreDocument() {

    const shared = location.hash.match(/sharedDoc=(.*)/);

    if (shared) {

        try {

            const data = JSON.parse(
                decodeURIComponent(
                    escape(
                        atob(
                            decodeURIComponent(shared[1])
                        )
                    )
                )
            );

            loadData(data);
            return;

        } catch (error) {

            console.log("Could not load shared document", error);

        }

    }

    try {

        const stored = localStorage.getItem(
            "wordEditorDocument"
        );

        if (stored) {

            loadData(JSON.parse(stored));
            return;

        }

    } catch (error) {}

    makePage();
    updateStatus();

}


/* =========================
   START WEBSITE
========================= */

restoreDocument();

</script>
